<div class="p-grid p-nogutter page-wrapper">
  <!-- HEADER -->
  <prp-header
    class="p-col-12 ui-g-nopad custom-header"
    [addToRight]="headerTemplate"
    appName="Babel Internauta"
    logoPath="assets/images/logo.png"
  >
  </prp-header>
  <ng-template #headerTemplate>
    <header-features
      [params]="headerFeaturesConfig"
      [addToMenu]="addToMenu"
    >
    </header-features>
  </ng-template>

  <!-- CONTENT -->
  <div class="content-wrapper ui-fluid" [ngClass]="{ 'solo-pec': isSoloPec }">
    @if (isSoloPec) { 
      <div class="solo-pec-content">
        <a routerLink="/attivita">Attività</a>
        <a routerLink="/shpeck">Pec</a>
        <a routerLink="/rubrica">Rubrica</a>
      </div>
    }
    <router-outlet></router-outlet>
  </div>
</div>
