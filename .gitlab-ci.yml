variables:
  PROJECT_PATH: "$CI_PROJECT_DIR"
  APP_OUTPUT_PATH: "$CI_PROJECT_DIR/artifacts/app"
  ENVIRONMENT: "stage"
  APP_PATH: "scrivania"

stages:
  - install
  - build
 
install_dependencies:
  stage: install
  image: node:20.14
  tags:
    - babel
  script:
    - npm config set registry http://gdml.internal.ausl.bologna.it:4873/ -g
    - npm config set fetch-retry-mintimeout 5 -g
    - npm config set fetch-retry-maxtimeout 5 -g
    - yarn install
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
  only:
    refs:
      - merge_requests
      - gdm

build_app:
  stage: build
  image: node:20.14
  tags:
    - babel
  script:
    - $CI_PROJECT_DIR/node_modules/.bin/ng build --configuration=$ENVIRONMENT --base-href /$APP_PATH/ --output-path dist
  after_script:
    - cp $PROJECT_PATH/Dockerfile $APP_OUTPUT_PATH
  artifacts:
    name: "angular-app-pipeline"
    paths:
      - $APP_OUTPUT_PATH
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
    policy: pull