stages:
  - install
 
install_dependencies:
  stage: install
  image: node:20.14
  tags:
    - babel
  script:
    - npm config set registry http://gdml.internal.ausl.bologna.it:4873/ -g
    - npm config set fetch-retry-mintimeout 5 -g
    - npm config set fetch-retry-maxtimeout 5 -g
    - yarn install
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
  only:
    refs:
      - merge_requests
      - gdm